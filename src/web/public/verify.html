<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NOVIX 서버 인증</title>
<link rel="icon" href="/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0E1024; --panel: #161936; --panel2: #1E2142; --line: #262A52; --text: #F2F2F7; --muted: #A9ABC6; --accent: #B3AAFF; --btn: #5B4BE8; --ok: #7EE2A8; --err: #FF9C9C; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', system-ui, sans-serif; word-break: keep-all; overflow-wrap: anywhere; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: .04em; margin: 8px 0 28px; color: var(--text); text-decoration: none; }
  .card { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px; display: flex; flex-direction: column; gap: 22px; }
  .who { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .who img { width: 64px; height: 64px; border-radius: 50%; background: var(--panel2); object-fit: cover; }
  .who .arrow { color: var(--muted); font-size: 22px; }
  h1 { margin: 0; font-size: 22px; font-weight: 900; text-align: center; line-height: 1.4; }
  .sub { margin: -10px 0 0; text-align: center; color: var(--muted); font-size: 15px; }
  ul { margin: 0; padding: 16px 18px; list-style: none; background: var(--panel2); border-radius: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
  li { display: flex; gap: 10px; align-items: flex-start; }
  li svg { flex: none; margin-top: 2px; }
  .ts { display: flex; justify-content: center; min-height: 65px; }
  button { width: 100%; min-height: 54px; border: none; border-radius: 12px; background: var(--btn); color: #fff; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .note { margin: 0; font-size: 13px; line-height: 1.7; color: var(--muted); text-align: center; }
  .result { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .result .icon { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .result.ok .icon { background: rgba(126, 226, 168, .15); }
  .result.err .icon { background: rgba(255, 156, 156, .15); }
  .result p { margin: 0; font-size: 15px; line-height: 1.7; color: var(--muted); }
  .result a.back { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 22px; border-radius: 12px; background: var(--btn); color: #fff; text-decoration: none; font-weight: 700; width: 100%; }
  @media (max-width: 400px) { .card { padding: 24px 18px; } h1 { font-size: 20px; } .who img { width: 54px; height: 54px; } }
</style>
</head>
<body>
  <a class="brand" href="/">
    <svg width="28" height="28" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1B1E3D"/><polygon points="142,128 222,128 370,384 290,384" fill="#7B6BFF"/><rect x="124" y="128" width="58" height="256" rx="12" fill="#F2F2F7"/><rect x="330" y="128" width="58" height="256" rx="12" fill="#F2F2F7"/></svg>
    NOVIX
  </a>

  <main class="card" id="card" aria-live="polite">
    <p class="note" id="loading">불러오는 중...</p>

    <section id="form" hidden style="display: flex; flex-direction: column; gap: 22px">
      <div class="who">
        <img id="uava" alt="">
        <span class="arrow" aria-hidden="true">→</span>
        <img id="gicon" alt="">
      </div>
      <h1><span id="gname"></span> 서버 인증</h1>
      <p class="sub"><span id="uname"></span> 계정으로 인증해요</p>
      <ul id="checks"></ul>
      <div class="ts" id="ts" hidden></div>
      <button id="go" type="button">인증하기</button>
      <p class="note">부계정·VPN 확인을 위해 접속 IP를 검사해요.<br>IP 원본은 저장하지 않고, 되돌릴 수 없는 암호값으로만 비교해요. 서버 관리자도 IP를 볼 수 없어요. <a href="/privacy">자세히</a></p>
    </section>

    <section id="result" class="result" hidden>
      <div class="icon" id="ricon"></div>
      <h1 id="rtitle"></h1>
      <p id="rtext"></p>
      <a class="back" id="back" href="https://discord.com/app">디스코드로 돌아가기</a>
    </section>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('t') || '';
  const CHECK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3AAFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
  const OK = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7EE2A8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
  const NO = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FF9C9C" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  let turnstileToken = null;
  let guildId = null;

  function show(ok, title, text) {
    $('loading').hidden = true; $('form').hidden = true; $('result').hidden = false;
    $('result').className = 'result ' + (ok ? 'ok' : 'err');
    $('ricon').innerHTML = ok ? OK : NO;
    $('rtitle').textContent = title;
    $('rtext').textContent = text;
    if (guildId) $('back').href = 'https://discord.com/channels/' + guildId;
  }

  async function load() {
    if (!token) return show(false, '잘못된 링크예요', '디스코드 서버의 인증 버튼을 눌러서 들어와 주세요.');
    const res = await fetch('/api/verify/info?t=' + encodeURIComponent(token));
    const d = await res.json().catch(() => ({}));
    if (!res.ok) return show(false, '링크를 쓸 수 없어요', d.error || '다시 시도해주세요.');
    guildId = d.guild.id;
    $('gname').textContent = d.guild.name;
    $('uname').textContent = d.user.name;
    $('uava').src = d.user.avatar;
    $('gicon').src = d.guild.icon || '/icon.svg';
    const items = ['사람인지 확인'];
    if (d.checks.vpn) items.push('VPN · 프록시 접속 차단');
    if (d.checks.alts) items.push('부계정 확인 (같은 인터넷으로 인증한 다른 계정)');
    if (d.checks.minAge) items.push(`디스코드 가입 ${d.checks.minAge}일 이상`);
    $('checks').replaceChildren(...items.map((t) => { const li = document.createElement('li'); li.innerHTML = CHECK; li.append(t); return li; }));

    if (d.turnstileSiteKey) {
      $('ts').hidden = false;
      $('go').disabled = true;
      window.onTurnstile = () => {
        turnstile.render('#ts', {
          sitekey: d.turnstileSiteKey, theme: 'dark', language: 'ko',
          callback: (t) => { turnstileToken = t; $('go').disabled = false; },
          'expired-callback': () => { turnstileToken = null; $('go').disabled = true; },
        });
      };
      const s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstile&render=explicit';
      s.async = true;
      document.head.append(s);
    }
    $('loading').hidden = true;
    $('form').hidden = false;
  }

  $('go').onclick = async () => {
    $('go').disabled = true;
    $('go').textContent = '확인 중...';
    try {
      const res = await fetch('/api/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token, turnstile: turnstileToken }) });
      const d = await res.json().catch(() => ({}));
      if (res.ok) show(true, d.already ? '이미 인증됐어요' : '인증 완료!', `${d.guildName} 서버를 즐겨주세요. 이 창은 닫아도 돼요.`);
      else show(false, '인증할 수 없어요', d.error || '다시 시도해주세요.');
    } catch {
      show(false, '연결 오류', '인터넷 연결을 확인하고 다시 시도해주세요.');
    }
  };

  load().catch(() => show(false, '오류가 났어요', '잠시 후 다시 시도해주세요.'));
})();
</script>
</body>
</html>
