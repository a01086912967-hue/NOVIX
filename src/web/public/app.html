<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVIX 대시보드 — 임베드 · 자동 메시지</title>
<link rel="icon" href="/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1024; --panel: #161936; --panel2: #1B1E3D; --line: #262A52; --line2: #33366A;
    --text: #F2F2F7; --muted: #A9ABC6; --accent: #7B6BFF; --accent-text: #B3AAFF; --btn: #5B4BE8;
    --ok: #7EE2A8; --err: #FF9C9C;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', system-ui, sans-serif; }
  a { color: var(--accent-text); }
  header { border-bottom: 1px solid var(--line); }
  .bar { max-width: 1280px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: .04em; }
  .user { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
  .user img { width: 32px; height: 32px; border-radius: 50%; }
  main { max-width: 1280px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { margin: 0 0 6px; font-size: 28px; font-weight: 900; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 15px; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .col-edit { flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .col-prev { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .card h2 { margin: 0 0 14px; font-size: 16px; font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .row > * { flex: 1 1 200px; min-width: 0; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  input[type=text], input[type=url], input[type=number], select, textarea {
    width: 100%; min-height: 44px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line2);
    color: var(--text); font: inherit; font-size: 15px; padding: 10px 12px;
  }
  textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
  input[type=color] { width: 56px; height: 44px; border: 1px solid var(--line2); border-radius: 10px; background: var(--panel2); padding: 4px; }
  .check { flex-direction: row; align-items: center; gap: 10px; color: var(--text); font-size: 14px; min-height: 44px; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  .btn { min-height: 46px; padding: 0 20px; border-radius: 10px; border: none; background: var(--btn); color: #fff; font-weight: 700; font-size: 15px; }
  .btn.ghost { background: transparent; border: 1px solid var(--line2); color: var(--text); }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; font-weight: 500; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .field-item { border: 1px solid var(--line2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .field-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
  .toast { min-height: 22px; font-size: 14px; }
  .toast.ok { color: var(--ok); } .toast.err { color: var(--err); }
  details summary { cursor: pointer; font-size: 14px; color: var(--accent-text); min-height: 32px; display: flex; align-items: center; }

  /* 디스코드 미리보기 */
  .dc { background: #313338; border-radius: 12px; padding: 16px; display: flex; gap: 14px; color: #DBDEE1; font-size: 15px; }
  .dc-ava { width: 42px; height: 42px; border-radius: 50%; background: #5865F2; flex: none; object-fit: cover; }
  .dc-body { min-width: 0; flex: 1; }
  .dc-name { font-weight: 700; color: #F2F3F5; display: flex; align-items: center; gap: 6px; }
  .dc-tag { font-size: 10px; background: #5865F2; color: #fff; border-radius: 4px; padding: 1px 5px; font-weight: 700; }
  .dc-content { white-space: pre-wrap; word-break: break-word; margin-top: 4px; line-height: 1.45; }
  .em { margin-top: 8px; background: #2B2D31; border-left: 4px solid #7B6BFF; border-radius: 4px; padding: 12px 16px 14px; max-width: 520px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
  .em-main { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .em-author { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #F2F3F5; }
  .em-author img, .em-foot img { width: 22px; height: 22px; border-radius: 50%; }
  .em-title { font-weight: 700; color: #F2F3F5; }
  .em-title.link { color: #00A8FC; }
  .em-desc { white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.45; }
  .em-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .em-field { grid-column: 1 / -1; font-size: 14px; min-width: 0; }
  .em-field.inline { grid-column: auto; }
  .em-field b { display: block; color: #F2F3F5; font-size: 13px; }
  .em-field span { white-space: pre-wrap; word-break: break-word; }
  .em-thumb { width: 80px; height: 80px; border-radius: 4px; object-fit: cover; }
  .em-image { grid-column: 1 / -1; max-width: 100%; border-radius: 4px; }
  .em-foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #B5BAC1; }

  .auto-item { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .auto-item:last-child { border-bottom: none; }
  .auto-info { min-width: 0; flex: 1 1 260px; font-size: 14px; line-height: 1.6; }
  .auto-info small { color: var(--muted); }
  .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #26295A; margin-right: 6px; }
  .empty { color: var(--muted); font-size: 14px; }
  .notice { background: #26295A; border-radius: 12px; padding: 16px; font-size: 14px; line-height: 1.7; }

  [hidden] { display: none !important; }
  body { word-break: keep-all; overflow-wrap: anywhere; }
  .auto-item .row { flex-wrap: nowrap; }
  .auto-item .row > * { flex: 0 0 auto; }

  /* ── 패드 (1024px 이하): 미리보기 → 편집 → 자동 메시지 목록 순서 ── */
  @media (max-width: 1024px) {
    .col-edit { flex-basis: 100%; order: 1; }
    .col-prev { display: contents; }
    .col-prev > .card { flex: 1 1 100%; min-width: 0; }
    .col-prev > .card:first-child { order: 0; }
    .col-prev > .card:last-child { order: 2; }
  }

  /* ── 폰 (640px 이하) ── */
  @media (max-width: 640px) {
    .bar { padding: 12px 14px; gap: 10px; }
    .bar > label { flex: 1 1 100% !important; order: 3; }
    .user span { display: none; }
    main { padding: 20px 12px 60px; }
    h1 { font-size: 24px; }
    .card { padding: 16px; border-radius: 14px; }
    .row > * { flex-basis: 100%; }
    .row > label[style*="flex: 0"] { flex: 1 1 calc(50% - 6px) !important; }
    .btn { width: 100%; min-height: 50px; }
    .btn.small { width: auto; min-height: 40px; }
    .row > div[style*="flex: 0 0 auto"] { flex: 1 1 100% !important; }
    input[type=text], input[type=url], input[type=number], select, textarea { font-size: 16px; } /* 아이폰 확대 방지 */
    .dc { padding: 12px; gap: 10px; font-size: 14px; }
    .dc-ava { width: 36px; height: 36px; }
    .em { padding: 10px 12px 12px; }
    .em-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .em-thumb { width: 60px; height: 60px; }
    .auto-item .row { width: 100%; }
    .auto-item .btn.small { flex: 1; }
  }
  @media (max-width: 380px) {
    .em-fields { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="/">
      <svg width="30" height="30" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1B1E3D"/><polygon points="142,128 222,128 370,384 290,384" fill="#7B6BFF"/><rect x="124" y="128" width="58" height="256" rx="12" fill="#F2F2F7"/><rect x="330" y="128" width="58" height="256" rx="12" fill="#F2F2F7"/></svg>
      NOVIX
    </a>
    <label style="flex: 0 1 280px">서버
      <select id="guild"></select>
    </label>
    <div class="user"><img id="uava" alt=""><span id="uname"></span><a href="/logout">로그아웃</a></div>
  </div>
</header>

<main>
  <h1>임베드 · 자동 메시지</h1>
  <p class="sub">꾸미고 바로 보내거나, 정해진 간격마다 자동으로 보내게 예약하세요.</p>
  <div id="noBot" class="notice" hidden></div>

  <div class="grid" id="workspace">
    <div class="col-edit">
      <section class="card">
        <h2>보낼 곳</h2>
        <div class="row">
          <label>채널<select id="channel"></select></label>
        </div>
        <label class="check" style="margin-top: 8px"><input type="checkbox" id="useHook"> 웹훅으로 보내기 (원하는 이름 · 프로필 사진)</label>
        <div class="row" id="hookRow" hidden>
          <label>보내는 이름<input type="text" id="hookName" maxlength="80" placeholder="공지봇"></label>
          <label>프로필 사진 주소<input type="url" id="hookAvatar" placeholder="https://..."></label>
        </div>
      </section>

      <section class="card">
        <h2>메시지</h2>
        <label>일반 메시지 (임베드 위에 표시)<textarea id="content" maxlength="2000" placeholder="@everyone 공지예요!"></textarea></label>
      </section>

      <section class="card">
        <h2>임베드</h2>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div class="row">
            <label style="flex: 0 0 auto">색<input type="color" id="color" value="#7b6bff"></label>
            <label>작성자 이름<input type="text" id="authorName" maxlength="256"></label>
            <label>작성자 아이콘 주소<input type="url" id="authorIcon" placeholder="https://..."></label>
          </div>
          <div class="row">
            <label>제목<input type="text" id="title" maxlength="256"></label>
            <label>제목 링크<input type="url" id="url" placeholder="https://..."></label>
          </div>
          <label>설명 (**굵게**, *기울임*, [링크](주소) 같은 디스코드 문법 그대로 써도 돼요)<textarea id="description" maxlength="4096" style="min-height: 140px"></textarea></label>
          <div class="row">
            <label>썸네일 (오른쪽 작은 이미지)<input type="url" id="thumbnail" placeholder="https://..."></label>
            <label>큰 이미지<input type="url" id="image" placeholder="https://... (/이미지링크로 만든 주소 OK)"></label>
          </div>
          <div id="fields" style="display: flex; flex-direction: column; gap: 10px"></div>
          <div><button class="btn ghost small" id="addField" type="button">+ 필드 추가</button></div>
          <div class="row">
            <label>푸터<input type="text" id="footerText" maxlength="2048"></label>
            <label>푸터 아이콘 주소<input type="url" id="footerIcon" placeholder="https://..."></label>
          </div>
          <label class="check"><input type="checkbox" id="timestamp"> 보낸 시간 표시</label>
        </div>
      </section>

      <section class="card">
        <h2>보내기</h2>
        <div class="row" style="align-items: flex-end">
          <div style="flex: 0 0 auto"><button class="btn" id="send" type="button">지금 보내기</button></div>
          <p class="toast" id="sendMsg" role="status" aria-live="polite" style="margin: 0; align-self: center"></p>
        </div>
        <details style="margin-top: 16px">
          <summary>⏱️ 반복 예약으로 저장하기</summary>
          <div class="row" style="margin-top: 12px; align-items: flex-end">
            <label style="flex: 0 1 120px">간격<input type="number" id="every" min="1" value="3"></label>
            <label style="flex: 0 1 140px">단위
              <select id="unit"><option value="1">분</option><option value="60" selected>시간</option><option value="1440">일</option></select>
            </label>
            <label class="check" style="flex: 1 1 200px"><input type="checkbox" id="sendNow"> 지금 한 번 보내고 시작</label>
            <div style="flex: 0 0 auto"><button class="btn ghost" id="saveAuto" type="button">예약 저장</button></div>
          </div>
          <p class="toast" id="autoMsg" role="status" aria-live="polite"></p>
        </details>
      </section>
    </div>

    <div class="col-prev">
      <section class="card">
        <h2>미리보기</h2>
        <div class="dc" id="preview"></div>
      </section>
      <section class="card">
        <h2>자동 메시지 목록</h2>
        <div id="autoList"><p class="empty">불러오는 중...</p></div>
      </section>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = { me: null, guild: null, fields: [] };
  const isUrl = (v) => /^https?:\/\/\S+$/i.test((v || '').trim());

  async function api(path, opts = {}) {
    const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
    if (res.status === 401) { location.href = '/login'; throw new Error('로그인이 필요해요'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '오류가 났어요');
    return data;
  }

  function toast(el, text, ok) { el.textContent = text; el.className = 'toast ' + (ok ? 'ok' : 'err'); }

  // ── 필드 ──
  function renderFields() {
    const box = $('fields');
    box.replaceChildren();
    state.fields.forEach((f, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'field-item';
      const head = document.createElement('div');
      head.className = 'field-head';
      head.textContent = `필드 ${i + 1}`;
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'btn ghost small'; del.textContent = '삭제';
      del.setAttribute('aria-label', `필드 ${i + 1} 삭제`);
      del.onclick = () => { state.fields.splice(i, 1); renderFields(); renderPreview(); };
      head.append(del);

      const mk = (labelText, key, tag) => {
        const l = document.createElement('label'); l.textContent = labelText;
        const inp = document.createElement(tag); if (tag === 'input') inp.type = 'text';
        inp.value = f[key] || ''; inp.maxLength = key === 'name' ? 256 : 1024;
        inp.oninput = () => { f[key] = inp.value; renderPreview(); };
        l.append(inp); return l;
      };
      const inl = document.createElement('label'); inl.className = 'check';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!f.inline;
      cb.onchange = () => { f.inline = cb.checked; renderPreview(); };
      inl.append(cb, ' 한 줄에 나란히 (inline)');
      wrap.append(head, mk('이름', 'name', 'input'), mk('내용', 'value', 'textarea'), inl);
      box.append(wrap);
    });
    $('addField').disabled = state.fields.length >= 25;
  }
  $('addField').onclick = () => { state.fields.push({ name: '', value: '', inline: false }); renderFields(); renderPreview(); };

  // ── 데이터 모으기 ──
  function collect() {
    const v = (id) => $(id).value.trim();
    return {
      channelId: $('channel').value,
      content: $('content').value,
      webhook: $('useHook').checked && v('hookName') ? { name: v('hookName'), avatar: v('hookAvatar') } : null,
      embed: {
        color: $('color').value,
        author: { name: v('authorName'), icon: v('authorIcon') },
        title: v('title'), url: v('url'), description: $('description').value,
        thumbnail: v('thumbnail'), image: v('image'),
        fields: state.fields.filter((f) => f.name.trim() && f.value.trim()),
        footer: { text: v('footerText'), icon: v('footerIcon') },
        timestamp: $('timestamp').checked,
      },
    };
  }

  // ── 미리보기 ──
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function img(src, cls) { const i = document.createElement('img'); i.src = src; i.alt = ''; if (cls) i.className = cls; i.referrerPolicy = 'no-referrer'; return i; }

  function renderPreview() {
    const p = collect();
    const box = $('preview');
    box.replaceChildren();
    const hook = p.webhook;
    const bot = state.me?.bot || { name: 'NOVIX', avatar: '/icon.svg' };
    const ava = img(hook && isUrl(hook.avatar) ? hook.avatar : bot.avatar, 'dc-ava');
    const body = el('div', 'dc-body');
    const name = el('div', 'dc-name', hook ? hook.name : bot.name);
    name.append(el('span', 'dc-tag', '앱'));
    body.append(name);
    if (p.content.trim()) body.append(el('div', 'dc-content', p.content));

    const e = p.embed;
    const hasEmbed = e.title || e.description.trim() || e.author.name || e.footer.text || isUrl(e.image) || isUrl(e.thumbnail) || e.fields.length;
    if (hasEmbed) {
      const em = el('div', 'em');
      em.style.borderLeftColor = e.color;
      const main = el('div', 'em-main');
      if (e.author.name) {
        const a = el('div', 'em-author');
        if (isUrl(e.author.icon)) a.append(img(e.author.icon));
        a.append(el('span', null, e.author.name));
        main.append(a);
      }
      if (e.title) main.append(el('div', 'em-title' + (isUrl(e.url) ? ' link' : ''), e.title));
      if (e.description.trim()) main.append(el('div', 'em-desc', e.description));
      if (e.fields.length) {
        const fs = el('div', 'em-fields');
        e.fields.forEach((f) => {
          const fe = el('div', 'em-field' + (f.inline ? ' inline' : ''));
          fe.append(el('b', null, f.name), el('span', null, f.value));
          fs.append(fe);
        });
        main.append(fs);
      }
      em.append(main);
      if (isUrl(e.thumbnail)) em.append(img(e.thumbnail, 'em-thumb'));
      if (isUrl(e.image)) em.append(img(e.image, 'em-image'));
      if (e.footer.text || e.timestamp) {
        const ft = el('div', 'em-foot');
        if (isUrl(e.footer.icon) && e.footer.text) ft.append(img(e.footer.icon));
        const t = [e.footer.text, e.timestamp ? '오늘 ' + new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }) : ''].filter(Boolean).join(' • ');
        ft.append(el('span', null, t));
        em.append(ft);
      }
      body.append(em);
    }
    if (!p.content.trim() && !hasEmbed) body.append(el('div', 'dc-content', '(아직 비어 있어요)'));
    box.append(ava, body);
  }

  document.querySelectorAll('#workspace input, #workspace textarea, #workspace select').forEach((x) => x.addEventListener('input', renderPreview));
  $('useHook').addEventListener('change', () => { $('hookRow').hidden = !$('useHook').checked; renderPreview(); });

  // ── 서버 · 채널 ──
  async function selectGuild(id) {
    const g = state.me.guilds.find((x) => x.id === id);
    state.guild = g;
    $('noBot').hidden = true;
    $('workspace').hidden = false;
    if (!g?.botIn) {
      $('workspace').hidden = true;
      $('noBot').hidden = false;
      $('noBot').replaceChildren(el('div', null, `NOVIX가 아직 "${g ? g.name : ''}" 서버에 없어요. `));
      const a = el('a', null, '봇 초대하기 →');
      a.href = '/invite?guild=' + encodeURIComponent(id);
      $('noBot').firstChild.append(a);
      return;
    }
    const { channels } = await api(`/api/guilds/${id}/channels`);
    const sel = $('channel');
    sel.replaceChildren();
    channels.forEach((c) => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = (c.category ? c.category + ' / ' : '') + '#' + c.name;
      sel.append(o);
    });
    loadAuto();
  }

  // ── 보내기 ──
  $('send').onclick = async () => {
    const btn = $('send'); btn.disabled = true;
    try {
      await api(`/api/guilds/${state.guild.id}/send`, { method: 'POST', body: JSON.stringify(collect()) });
      toast($('sendMsg'), '✅ 보냈어요!', true);
    } catch (err) { toast($('sendMsg'), '❌ ' + err.message, false); }
    btn.disabled = false;
  };

  $('saveAuto').onclick = async () => {
    const minutes = Number($('every').value) * Number($('unit').value);
    const btn = $('saveAuto'); btn.disabled = true;
    try {
      await api(`/api/guilds/${state.guild.id}/auto`, {
        method: 'POST',
        body: JSON.stringify({ ...collect(), intervalMinutes: minutes, sendNow: $('sendNow').checked }),
      });
      toast($('autoMsg'), '✅ 예약했어요!', true);
      loadAuto();
    } catch (err) { toast($('autoMsg'), '❌ ' + err.message, false); }
    btn.disabled = false;
  };

  // ── 자동 메시지 목록 ──
  function every(min) {
    if (min % 1440 === 0) return `${min / 1440}일마다`;
    if (min % 60 === 0) return `${min / 60}시간마다`;
    return `${min}분마다`;
  }
  async function loadAuto() {
    const box = $('autoList');
    try {
      const { items } = await api(`/api/guilds/${state.guild.id}/auto`);
      box.replaceChildren();
      if (!items.length) { box.append(el('p', 'empty', '아직 없어요. 왼쪽에서 꾸미고 "반복 예약으로 저장하기"를 눌러보세요.')); return; }
      items.forEach((a) => {
        const row = el('div', 'auto-item');
        const info = el('div', 'auto-info');
        const top = el('div');
        top.append(el('span', 'pill', a.enabled ? '켜짐' : '멈춤'), el('span', 'pill', every(a.intervalMinutes)), document.createTextNode('#' + a.channelName));
        const prev = el('div', null, (a.webhookName ? `[${a.webhookName}] ` : '') + a.preview);
        const next = el('small', null, '다음 전송: ' + new Date(a.nextRun).toLocaleString('ko-KR'));
        info.append(top, prev, next);
        const actions = el('div', 'row');
        actions.style.flex = '0 0 auto';
        const t = el('button', 'btn ghost small', a.enabled ? '멈추기' : '다시 켜기'); t.type = 'button';
        t.onclick = async () => { await api(`/api/guilds/${state.guild.id}/auto/${a.id}/toggle`, { method: 'POST', body: '{}' }); loadAuto(); };
        const d = el('button', 'btn ghost small', '삭제'); d.type = 'button';
        d.onclick = async () => { if (confirm('이 자동 메시지를 삭제할까요?')) { await api(`/api/guilds/${state.guild.id}/auto/${a.id}`, { method: 'DELETE' }); loadAuto(); } };
        actions.append(t, d);
        row.append(info, actions);
        box.append(row);
      });
    } catch (err) { box.replaceChildren(el('p', 'empty', '❌ ' + err.message)); }
  }

  // ── 시작 ──
  (async () => {
    state.me = await api('/api/me');
    $('uname').textContent = state.me.user.name;
    $('uava').src = state.me.user.avatar ? `https://cdn.discordapp.com/avatars/${state.me.user.id}/${state.me.user.avatar}.png?size=64` : '/icon.svg';
    const sel = $('guild');
    if (!state.me.guilds.length) {
      $('workspace').hidden = true; $('noBot').hidden = false;
      $('noBot').textContent = '관리 권한이 있는 서버가 없어요. 서버 관리 권한이 있는 계정으로 로그인해주세요.';
      return;
    }
    state.me.guilds.forEach((g) => {
      const o = document.createElement('option');
      o.value = g.id; o.textContent = g.name + (g.botIn ? '' : ' (봇 초대 필요)');
      sel.append(o);
    });
    sel.onchange = () => selectGuild(sel.value).catch((e) => alert(e.message));
    renderFields();
    renderPreview();
    await selectGuild(sel.value);
  })().catch((e) => { document.querySelector('main').prepend(el('p', 'toast err', '❌ ' + e.message)); });
})();
</script>
</body>
</html>
